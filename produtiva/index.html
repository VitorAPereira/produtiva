<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SELETO</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar" id="sidebar">

<div class="sidebar-header">

<h3>
Categorias
</h3>

<button onclick="toggleSidebar()">
✕
</button>

</div>

<button onclick="filterCategory('todos')">
Todos
</button>

<button onclick="filterCategory('gamer')">
Gamer
</button>

<button onclick="filterCategory('moda')">
Moda
</button>

<button onclick="filterCategory('tecnologia')">
Tecnologia
</button>

<button onclick="filterCategory('casa')">
Casa
</button>

</aside>

<!-- HEADER -->

<header>

<div class="topbar">

<div class="left-header">

<button class="menu-toggle" onclick="toggleSidebar()">
☰ Categorias
</button>

<div class="logo">
SELETO
</div>

</div>

<div class="search-box">

<input 
type="text"
placeholder="Pesquisar produtos..."
id="searchInput"
onkeyup="searchProducts()"
>

<button>
🔍
</button>

</div>

<div class="header-actions">

<a href="favoritos.html">

<button>
❤ Favoritos
</button>

</a>

<button>
👤 Login
</button>

</div>

</div>

</header>

<!-- MAIN -->

<main class="main-content">

<!-- BANNER -->

<section class="banner">

<div class="banner-content">

<h1>

OS MELHORES<br>

PRODUTOS<br>

<span>
VERIFICADOS.
</span>

</h1>

<p>

Produtos analisados,
seguros e recomendados.

</p>

</div>

</section>

<!-- CATALOGO -->

<section class="section">

<h2>
Catálogo
</h2>

<div class="products-grid" id="productsGrid">

</div>

</section>

</main>

<script src="produtos.js"></script>
<script src="script.js"></script>

</body>

</html>
