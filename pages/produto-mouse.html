<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mouse Gamer RGB</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<div class="topbar">

<a href="../catalogo-gamer.html">

<button class="menu-toggle">
← Voltar
</button>

</a>

<div class="logo">
SELETO
</div>

</div>

</header>

<main class="main-content">

<section class="product-page">

<div class="product-gallery">

<img 
src="https://images.unsplash.com/photo-1527814050087-3793815479db?q=80&w=1200"
class="main-product-image"
id="mainImage"
>

<div class="product-thumbs">

<img 
src="https://images.unsplash.com/photo-1527814050087-3793815479db?q=80&w=1200"
onclick="changeImage(this.src)"
>

<img 
src="https://images.unsplash.com/photo-1517336714739-489689fd1ca8?q=80&w=1200"
onclick="changeImage(this.src)"
>

<img 
src="https://images.unsplash.com/photo-1498049794561-7780e7231661?q=80&w=1200"
onclick="changeImage(this.src)"
>

</div>

</div>

<div class="product-info">

<h1>
Mouse Gamer RGB
</h1>

<p>
Mouse gamer premium com RGB e alta precisão.
</p>

<div class="product-buttons">

<button 
class="favorite-btn"
onclick="favoriteProduct(
'Mouse Gamer RGB',
'https://images.unsplash.com/photo-1527814050087-3793815479db?q=80&w=1200',
'pages/produto-mouse.html'
)"
>
❤ Favoritar
</button>

<a 
href="https://amazon.com"
target="_blank"
>

<button class="buy-btn">
COMPRAR
</button>

</a>

</div>

</div>

</section>

<section class="comments">

<h2>
Comentários
</h2>

<textarea 
id="commentInput"
placeholder="Digite um comentário..."
></textarea>

<button 
class="buy-btn"
onclick="addComment()"
>
PUBLICAR
</button>

<div id="commentsList">

</div>

</section>

<section class="section">

<h2>
Produtos Semelhantes
</h2>

<div class="products-grid">

<a href="produto-teclado.html" class="product-link">

<div class="product-card">

<img src="https://images.unsplash.com/photo-1511467687858-23d96c32e4ae?q=80&w=1200">

<h3>
Teclado Mecânico
</h3>

<p>
RGB Premium
</p>

</div>

</a>

</div>

</section>

</main>

<script src="../js/script.js"></script>

</body>

</html>
